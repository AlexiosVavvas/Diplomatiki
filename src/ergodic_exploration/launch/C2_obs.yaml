obstacles:
  # Avoiding bumps at ~(100, 260) top-left and ~(260, 100) bottom-right
  
  # Bottom-left corner - mirrors top-left bump
  - pos: [60.0, 80.0]
    dimensions: 40.0
    obs_type: 'circle'
    obs_name: "Circle BL"

  # Top-right corner - mirrors bottom-right bump  
  - pos: [300.0, 290.0]
    dimensions: 45.0
    obs_type: 'circle'
    obs_name: "Circle TR"

  # Center - creates a chokepoint between bumps
  - pos: [150.0, 170.0]
    dimensions: [200.0, 35.0]
    obs_type: 'rectangle'
    obs_name: "Rectangle Center"

  # Top edge center - guards upper passage
  - pos: [180.0, 340.0]
    dimensions: 35.0
    obs_type: 'circle'
    obs_name: "Circle Top"

  # Bottom edge center - guards lower passage
  - pos: [180.0, 30.0]
    dimensions: 35.0
    obs_type: 'circle'
    obs_name: "Circle Bottom"

