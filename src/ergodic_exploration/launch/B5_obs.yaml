walls:

  - obs_type: 'wall'                   # Type: 'wall'
    pos: [160, 200.0, 0]               # Explicit position [x, y, z]
    dimensions: [300, -300, 0]    # Normal vector [nx, ny, nz] - magnitude = visual length
    kappa: 350
    rho0: 70
    obs_name: "Wall One"             # Descriptive name

  - obs_type: 'wall'                   # Type: 'wall'
    pos: [200.0, 160.0, 0]               # Explicit position [x, y, z]
    dimensions: [-300, 300, 0]    # Normal vector [nx, ny, nz] - magnitude = visual length
    kappa: 350
    rho0: 70
    obs_name: "Wall Two"             # Descriptive name

  - obs_type: 'wall'                   # Type: 'wall'
    pos: [0, 0, 380]               # Explicit position [x, y, z]
    dimensions: [0, 0, 1]    # Normal vector [nx, ny, nz] - magnitude = visual length
    kappa: 300
    rho: 50
    obs_name: "Low Barrier Wall"       # Descriptive name
