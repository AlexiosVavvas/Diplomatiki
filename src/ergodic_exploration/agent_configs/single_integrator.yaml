# Single Integrator Agent Configuration
# Agent type and model parameters
agent:
  model_type: "SingleIntegrator"
  
  # Dynamics model parameters
  dynamics:
    dt: 0.0012
    
  # Control parameters
  control:
    u_limits_init: [[-1, 1], [-1, 1]]
    u_limits: [[-1, 1], [-1, 1]]
    time_to_apply_ulimits: 0  # [s] after which to switch u_limits
    u_nominal: null
    
    # Ergodic controller parameters
    Q: 1
    R: [[0.001, 0.0], [0.0, 0.001]]
    prediction_dt_multiplier: 25  # PREDICTION_DT = dt * multiplier
    relax_factor: 1.0
    
    # Timing parameters
    ts: 0.01                # Sampling time
    t_h: 0.1                # Horizon time
    delta_t_erg: 1.25       # Ergodic time window
    
    # Optimization parameters
    inf_buf_flag: true      # Whether to use infinite states buffer
    bar_weight: 0
    update_eid_freq: 110    # How often to update EID phi function
    
    # Safety parameters (CBF)
    cbf_skip_iter: 8        # How often to apply CBF safety filter
    delta_safe: 0.1
    alpha_hdot: 100
    alpha_h: 20
    kappa_wall: 0.5
    rho_wall: 1.5
    kappa_obs: 1
    rho_obs: 0.15
    kappa_obs_virtual: 1    # Parameters for avoiding other agents
    rho_obs_virtual: 0.4
    
  # System parameters
  system:
    imax: ".inf"
    publish_data_freq: 30   # How often to publish data to ROS topic
  
  # Agent communication and range parameters (optional - can be overridden by command line)
  antenna_radius: ".inf"        # Infinite range by default
  kmax: 4                       # Maximum Fourier modes for reconstruction
  antenna_range_flag: false     # Whether antenna range is limited
  talk_alike_flag: false        # Whether to communicate only with similar models
  same_l_bounds_flag: true      # Whether to communicate only with agents having same L bounds

# Target and EKF configuration
targets:
  # Ground truth target positions [x, y, z]
  real_positions:
    - [2.0, 2.0, 0.0]
    - [4.0, 8.0, 0.0]
    - [8.0, 6.0, 0.0]
  
  # EKF parameters for target estimation
  ekf:
    # Initial estimate covariance (3x3 diagonal values)
    sigma_init_diag: [0.5, 0.5, 0.5]
    
    # Sensor noise covariance (2x2 diagonal values)
    R_diag: [0.1, 0.1]
    
    # Process noise covariance (3x3 diagonal values) 
    Q_diag: [0.0001, 0.0001, 0.0001]
    
    # Sensor parameters
    sensor_range: 3.0
    sensor_R_diag: [0.1, 0.1]  # Sensor noise covariance

# System flags
flags:
  localise_targets: true
  update_eid: false
  save_images: false

# Phi (exploration density) configuration
# type: 'uniform' for constant uniform coverage, 'gaussian_bumps' for Gaussian bump-based coverage
phi:
  type: uniform  # Options: 'uniform', 'gaussian_bumps'
  # Uncomment and configure bumps if type is 'gaussian_bumps'
  # bumps:
  #   - x_pos_perc: 0.7
  #     y_pos_perc: 0.3
  #     height: 5
  #     width_scale: 0.7