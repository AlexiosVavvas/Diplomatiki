# Example of different kappa/rho0 values and their effects:
# - Low kappa (0.5-0.8): Softer obstacle influence
# - Medium kappa (1.0-1.2): Standard obstacle influence  
# - High kappa (1.5-2.0): Strong obstacle influence
# 
# - Low rho0 (0.1-0.2): Obstacle effect starts close to boundary
# - Medium rho0 (0.25-0.4): Standard obstacle influence distance
# - High rho0 (0.5+): Obstacle effect extends far from boundary